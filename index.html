<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>승률계산기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 밝은 단일 테마의 스포츠 중계 그래픽. 팀 색 블록 + 큰 컨덴스드 숫자, 나머지는 흰 카드와 회청색 바탕 */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --sunk:#F3F5F9; --ink:#0F172A; --ink2:#334155; --muted:#64748B; --faint:#94A3B8; --line:#E5E9F0;
  --pink:#E0457B; --pink-d:#BE2F63; --pink-t:#FCE7EF; --blue:#2F6BE0; --blue-d:#1D4FB5; --blue-t:#E3ECFC;
  --win:#16A36A; --draw:#A3ADBD; --loss:#E5484D; --win-t:#E3F5EC; --draw-t:#EEF1F5; --loss-t:#FDE8E8;
  --gold:#EBA10A; --gold-t:#FDF3DC; --silver:#97A3B6; --bronze:#C9824D; --bar:#1E293B;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --num:"Barlow Condensed","Arial Narrow","IBM Plex Sans KR",sans-serif;
  --r:22px; --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.005em}
.muted{color:var(--muted)}
svg.i{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px} svg.i.xs{width:13px;height:13px} svg.i.lg{width:22px;height:22px}
svg.i.f{fill:currentColor;stroke:none}
.shirt.A{color:var(--pink)} .shirt.B{color:var(--blue)} .shirt.W{color:#fff}
.gold{color:var(--gold)}

/* 상단 배너 · 탭 */
.hero{position:relative;padding-top:16px}
.hero-media{background:#04060A;overflow:hidden;border-radius:var(--r);box-shadow:var(--shadow)}
.hero-img{display:block;width:100%;height:auto;aspect-ratio:1641/343;min-height:150px;object-fit:cover;object-position:50% 50%}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero-bar{position:relative;margin-top:12px;background:var(--surface);border-radius:20px;box-shadow:0 2px 4px rgba(15,23,42,.06),0 12px 32px rgba(15,23,42,.12);padding:14px 16px 14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero-bar::before{content:"";position:absolute;left:18px;right:18px;top:0;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--pink) 0 50%,var(--blue) 50% 100%)}
.hb-title{min-width:0}
.hb-title .eyebrow{color:var(--gold);font-size:11px;display:block;line-height:1.2}
.hb-title h1{margin:2px 0 0;font-size:20px;font-weight:700;line-height:1.2;letter-spacing:-.02em;display:inline}
.hb-title small{font-size:12.5px;color:var(--muted);font-weight:500;margin-left:8px}
.status{display:flex;align-items:center;gap:8px;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--loss)}
.pill.live .dot{background:var(--win);box-shadow:0 0 0 3px var(--win-t)}
.iconbtn{border:0;background:var(--sunk);border-radius:12px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.iconbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(238,241,246,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);padding-top:12px}
@media (max-width:420px){.hb-title small{display:block;margin:2px 0 0}.pill #pillText{font-size:11.5px}}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#E2E7EF;border-radius:14px;padding:4px;margin-bottom:12px}
.tab{border:0;background:none;border-radius:11px;padding:9px 4px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.1)}

main.wrap{padding-block:4px 48px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.view{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.view>*{min-width:0}
.card{background:var(--surface);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.ch .ci{width:34px;height:34px;border-radius:11px;background:var(--sunk);color:var(--ink2);display:grid;place-items:center;flex-shrink:0}
.ch h3{margin:0;font-size:15.5px;font-weight:700;flex:1;min-width:0;letter-spacing:-.01em}
.ch .aside{font-size:12.5px;color:var(--muted);white-space:nowrap}
.sect{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ink);padding:8px 4px 0;letter-spacing:-.01em}
.note{font-size:12.5px;color:var(--muted);margin:0;display:flex;gap:6px;align-items:flex-start;padding:0 4px}
.note svg{margin-top:2px}
.eyebrow{font-family:var(--num);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase}

/* 공통 마크 */
.bar3{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.bar3 i{display:block;height:100%}
.bar3 .W{background:var(--win)}.bar3 .D{background:var(--draw)}.bar3 .L{background:var(--loss)}.bar3 .A{background:var(--pink)}.bar3 .B{background:var(--blue)}
.key{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key b{color:var(--ink);font-family:var(--num);font-size:15px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.W{background:var(--win)}.dot.D{background:var(--draw)}.dot.L{background:var(--loss)}.dot.off{border:1.5px solid var(--faint)}
.rc{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
.rc.W{background:var(--win);color:#fff} .rc.D{background:var(--draw-t);color:var(--muted)} .rc.L{background:var(--loss-t);color:var(--loss)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--sunk);color:var(--ink2)}
.tag.A{background:var(--pink-t);color:var(--pink-d)} .tag.B{background:var(--blue-t);color:var(--blue-d)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;line-height:1.45;padding:7px 10px;border-radius:8px;white-space:pre-line;max-width:220px;box-shadow:0 8px 24px rgba(15,23,42,.2)}

/* ===== 경기 결과 ===== */
.season{border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}
.season .blocks{display:grid;grid-template-columns:1fr 1fr;position:relative}
.season .blk{padding:18px 20px 20px;color:#fff;display:grid;gap:2px;position:relative;overflow:hidden}
.season .blk.A{background:linear-gradient(150deg,var(--pink) 0%,var(--pink-d) 100%)}
.season .blk.B{background:linear-gradient(210deg,var(--blue) 0%,var(--blue-d) 100%);text-align:right;justify-items:end}
.season .blk .t{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.season .blk .big{font-family:var(--num);font-weight:800;font-size:68px;line-height:.9;letter-spacing:-.01em}
.season .blk .u{font-size:13px;font-weight:600;opacity:.85}
.season .blk svg.bg{position:absolute;width:120px;height:120px;opacity:.12;bottom:-24px}
.season .blk.A svg.bg{right:-18px} .season .blk.B svg.bg{left:-18px}
.season .draw{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;background:var(--surface);display:grid;place-content:center;text-align:center;box-shadow:0 4px 16px rgba(15,23,42,.18)}
.season .draw b{font-family:var(--num);font-weight:800;font-size:30px;line-height:1}
.season .draw span{font-size:11px;color:var(--muted);font-weight:600}
.season .ttl{position:absolute;left:50%;top:12px;transform:translateX(-50%);color:#fff;opacity:.9;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.fact{display:grid;gap:2px;justify-items:center;padding:14px 8px;text-align:center}
.fact+.fact{border-left:1px solid var(--line)}
.fact .k{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:500}
.fact .v{font-size:26px;line-height:1.1}
.flow-plot{display:grid;gap:3px;height:128px;position:relative}
.flow-plot::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.fcol{position:relative;cursor:pointer;min-width:0}
.fcol i{position:absolute;left:50%;transform:translateX(-50%);width:min(100%,10px)}
.fcol i.A{bottom:50%;background:var(--pink);border-radius:3px 3px 0 0}
.fcol i.B{top:50%;background:var(--blue);border-radius:0 0 3px 3px}
.fcol i.D{top:calc(50% - 3px);height:6px;width:6px;border-radius:50%;background:var(--draw);box-shadow:0 0 0 2px var(--surface)}
.fcol:hover i{filter:brightness(1.1)}
.months{display:grid;gap:3px;margin-top:8px;font-size:11px;color:var(--faint);font-weight:500}
.months span{white-space:nowrap}
.flowkey{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.games{display:grid;gap:12px}
details.game{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
details.game summary{list-style:none;cursor:pointer;display:grid}
details.game summary::-webkit-details-marker{display:none}
.g-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:14px 18px 12px}
.g-top .when{display:inline-flex;align-items:center;gap:6px}
.g-top .when b{color:var(--ink);font-weight:600}
.sb{display:grid;grid-template-columns:1fr 1fr;margin:0 12px;border-radius:14px;overflow:hidden;position:relative}
.sb .h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 26px 10px 16px;color:#fff;font-weight:700;font-size:14px}
.sb .h.B{padding:10px 16px 10px 26px}
.sb .h.A{background:var(--pink)} .sb .h.B{background:var(--blue);flex-direction:row-reverse}
.sb .h .s{font-family:var(--num);font-weight:800;font-size:40px;line-height:1}
.sb .h .t{display:inline-flex;align-items:center;gap:6px}
.sb .h.lose{background:var(--sunk);color:var(--faint)}
.sb .h.lose .shirt{color:var(--faint)}
.sb .vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--surface);color:var(--muted);font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.08em;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;box-shadow:0 2px 8px rgba(15,23,42,.12)}
.g-info{display:grid;gap:7px;font-size:13px;color:var(--ink2);padding:14px 18px 0}
.g-info div{display:flex;gap:8px;align-items:flex-start}
.g-info svg{margin-top:2px;color:var(--muted)}
.g-info .lbl{font-weight:700;color:var(--ink);margin-right:6px}
.g-info svg.gold{color:var(--gold)}
.g-more{display:flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:14px;padding:11px 0;border-top:1px solid var(--line)}
.g-more svg{transition:transform .2s}
details.game[open] .g-more svg:last-child{transform:rotate(180deg)}
details.game[open] .g-more .o{display:none} details.game:not([open]) .g-more .c{display:none}
.lineups{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:4px 18px 18px}
.lineups ul{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:14px;align-content:start}
.lineups .lh{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding-bottom:7px;border-bottom:2px solid var(--line);margin-bottom:1px}
.lineups .A .lh{border-color:var(--pink)} .lineups .B .lh{border-color:var(--blue)}
.lineups li{display:flex;justify-content:space-between;align-items:center;gap:6px}
.lineups button{border:0;background:none;padding:0;cursor:pointer;text-align:left;color:var(--ink)}
.lineups button:hover{text-decoration:underline}
.lineups .guest{color:var(--muted)}
.lineups .marks{display:inline-flex;gap:3px;align-items:center;color:var(--muted);font-size:13px}

/* ===== 전체 순위 ===== */
.awards{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.award{border:0;background:var(--surface);border-radius:18px;padding:14px 18px;text-align:left;cursor:pointer;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:14px;align-items:center;box-shadow:var(--shadow)}
.award .ic{width:42px;height:42px;border-radius:13px;background:var(--gold-t);color:var(--gold);display:grid;place-items:center}
.award .who{display:grid;min-width:0}
.award .k{font-size:12px;color:var(--muted);font-weight:600}
.award .nm{font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.award .nm small{font-weight:500;color:var(--muted);font-size:12px;margin-left:4px}
.award .v{font-size:32px;line-height:1;text-align:right}
.award .v small,.v small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:600;margin-left:2px}
.seg{display:flex;gap:4px;overflow-x:auto;background:var(--sunk);border-radius:12px;padding:4px;margin-bottom:14px;scrollbar-width:none}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.1)}
.top3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.t3{border:0;border-radius:16px;padding:12px 12px 14px;cursor:pointer;text-align:left;display:grid;gap:2px;position:relative;overflow:hidden;background:var(--sunk)}
.t3 .rk{font-family:var(--num);font-weight:800;font-size:44px;line-height:.85}
.t3.r1{background:var(--gold-t)} .t3.r1 .rk{color:var(--gold)}
.t3.r2 .rk{color:var(--silver)} .t3.r3 .rk{color:var(--bronze)}
.t3 .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}
.t3 .v{font-size:22px;line-height:1.1}
.search{position:relative;margin-bottom:4px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search input{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 12px 10px 38px;font-size:15px}
.search input:focus{background:var(--surface)}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lb li:last-child{border-bottom:0}
.lb li.me{background:linear-gradient(90deg,var(--gold-t),transparent);border-radius:12px}
.lb .rk{text-align:center;font-family:var(--num);font-weight:800;color:var(--faint);font-size:24px;line-height:1}
.lb .nm{font-weight:700;display:flex;align-items:center;gap:5px;min-width:0;font-size:15px}
.lb .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .sub{font-size:12px;color:var(--muted);font-family:var(--sans);font-weight:500}
.lb .trk{height:5px;border-radius:3px;background:var(--sunk);margin-top:7px;overflow:hidden}
.lb .trk i{display:block;height:100%;background:var(--bar);border-radius:3px}
.lb .v{font-size:24px;text-align:right;min-width:60px;line-height:1}
details.un summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
details.un summary::-webkit-details-marker{display:none}
details.un summary .ci{width:34px;height:34px;border-radius:11px;background:var(--sunk);display:grid;place-items:center;color:var(--ink2)}
details.un summary h3{margin:0;font-size:15.5px;font-weight:700;flex:1}
details.un summary svg.chev{color:var(--muted);transition:transform .2s}
details.un[open] summary svg.chev{transform:rotate(180deg)}
.ur{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.ur li{display:grid;grid-template-columns:minmax(0,1fr) 96px 52px;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.ur .trk{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.ur .trk i{display:block;height:100%;background:var(--faint)}
.ur .left{font-size:15px;color:var(--muted);text-align:right}

/* ===== 개인 기록 ===== */
.pickrow{display:flex;gap:8px}
.pickrow .search{flex:1;margin:0}
.pickrow .search input{background:var(--surface);border-color:transparent;box-shadow:var(--shadow)}
.savebtn{border:0;background:var(--surface);border-radius:12px;padding:0 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink2);white-space:nowrap;box-shadow:var(--shadow)}
.savebtn.on{color:var(--gold)}
.savebtn.on svg{fill:currentColor}
.pcard{border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}
.pcard .band{position:relative;padding:20px 20px 18px;color:#fff;background:linear-gradient(118deg,var(--pink) 0%,var(--pink-d) 54%,var(--blue) 54%,var(--blue-d) 100%);overflow:hidden}
.pcard .band::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.18),transparent 60%);pointer-events:none}
.pcard .band>*{position:relative;z-index:1}
.pcard .eyebrow{color:rgba(255,255,255,.8)}
.pcard h2{margin:4px 0 0;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;word-break:keep-all;display:flex;align-items:center;gap:8px}
.pcard .sub{font-size:12.5px;color:rgba(255,255,255,.88);display:flex;align-items:center;gap:5px;margin-top:4px}
.pcard .ptsrow{display:flex;align-items:flex-end;gap:10px;margin-top:14px}
.pcard .ptsrow b{font-family:var(--num);font-weight:800;font-size:72px;line-height:.82}
.pcard .ptsrow span{font-size:13px;color:rgba(255,255,255,.9);font-weight:600;padding-bottom:4px}
.pcard .ptsrow .rkb{margin-left:auto;background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(15,23,42,.18);border-radius:12px;padding:6px 10px;display:grid;justify-items:center;line-height:1}
.pcard .ptsrow .rkb b{font-size:30px;line-height:1}
.pcard .ptsrow .rkb small{font-size:11px;font-weight:700;color:var(--muted)}
.pcard .body{padding:18px 20px 20px;display:grid;gap:16px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--sunk);border-radius:14px;padding:12px 10px;display:grid;gap:2px;justify-items:start}
.tile .k{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
.tile .v{font-size:30px;line-height:1.05}
.tile .r{font-size:11.5px;color:var(--muted);font-weight:700;display:inline-flex;align-items:center;gap:3px}
.tile .r.top{color:var(--gold)}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prog{display:grid;gap:8px;font-size:13px;color:var(--ink2)}
.prog .trk{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.prog .trk i{display:block;height:100%;background:var(--gold);border-radius:3px}
.wdl{display:grid;gap:10px}
.cmp{display:grid;gap:16px}
.cmp-row{display:grid;grid-template-columns:22px 44px minmax(0,1fr) 62px;gap:8px;align-items:center}
.cmp-row svg{color:var(--muted)}
.cmp-row .lab{font-size:13px;color:var(--ink2);font-weight:600}
.cmp-row .val{text-align:right;font-size:20px;line-height:1}
.ctrk{position:relative;height:10px;border-radius:5px;background:var(--sunk)}
.ctrk .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--bar);min-width:4px}
.ctrk .avg{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--gold);box-shadow:0 0 0 2px var(--surface)}
.strip{display:grid;gap:3px}
.strip .c{height:26px;border-radius:5px}
.strip .c.W{background:var(--win)}.strip .c.D{background:var(--draw)}.strip .c.L{background:var(--loss)}
.strip .c.off{background:var(--sunk)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcard{border-radius:14px;padding:12px;display:grid;gap:6px}
.tcard.A{background:var(--pink-t)} .tcard.B{background:var(--blue-t)}
.tcard .tt{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700}
.tcard.A .tt{color:var(--pink-d)} .tcard.B .tt{color:var(--blue-d)}
.tcard .wr{font-size:30px;line-height:1.05}
.tcard .wr small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:600;margin-left:3px}
.tcard .bar3{background:rgba(255,255,255,.7)}
.tcard .sm{font-size:12px;color:var(--ink2)}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log .l1{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.log .l1 .sc{font-size:19px;margin-left:4px}
.log .l2{font-size:12px;color:var(--muted)}
.log .marks{display:inline-flex;align-items:center;gap:8px;color:var(--ink2);font-size:14px}
.log .marks span{display:inline-flex;align-items:center;gap:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--sunk);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.chip small{color:var(--muted);font-family:var(--num);font-weight:700;font-size:13px}
.chip:hover{background:var(--line)}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-top:6px}
@media (max-width:420px){.season .blk .big{font-size:56px}.sb .h .s{font-size:34px}.pcard .ptsrow b{font-size:60px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

async function getCSV(url){
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(res.status);
  const text = await res.text();
  if (/^\s*<!doctype|<html/i.test(text)) throw new Error('공개 설정 확인 필요');
  return parseCSV(text);
}
async function fetchSheet(name){
  const base = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}`;
  try { return await getCSV(`${base}/export?format=csv&gid=${CONFIG.SHEETS[name]}&_=${Date.now()}`); }
  catch (e) { return await getCSV(`${base}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}&_=${Date.now()}`); }
}
function parseCSV(text){
  const out = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); out.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); out.push(row); }
  return out;
}

const ic = (name, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[name]}</svg>`;
const shirt = (t, cls = 'sm') => `<svg class="i f shirt ${t} ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P.shirt}</svg>`;
const starIc = (cls = 'xs') => `<svg class="i f gold ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P.star}</svg>`;

/* ===== 유틸 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = v => (v == null ? '' : String(v)).trim();
const int = v => { const n = parseInt(clean(v).replace(/[^\d-]/g, ''), 10); return isNaN(n) ? 0 : n; };
const ko = (a, b) => a.localeCompare(b, 'ko');
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} }
};
const WD = ['일','월','화','수','목','금','토'];
function fmtDate(s){
  s = clean(s);
  if (!/^\d{8}$/.test(s)) return { short: s || '날짜 없음', long: s || '날짜 없음', ok:false };
  const y = +s.slice(0,4), m = +s.slice(4,6), d = +s.slice(6,8);
  return { short: `${m}.${d}`, long: `${m}월 ${d}일 (${WD[new Date(y, m-1, d).getDay()]})`, m, y, ok:true };
}
const TEAM = { A:'핑크팀', B:'블루팀' };
const RES = { W:'승', D:'무', L:'패' };
const pct = (w, l) => (w + l) ? w / (w + l) : 0;
const pctTxt = v => (v * 100).toFixed(1).replace(/\.0$/, '') + '%';
const gLabel = id => /^\d+$/.test(id) ? '#' + id : id;
const tipAttr = s => `data-tip="${esc(s)}"`;
const METRIC = {
  pts:{ t:'승점', unit:'점', icon:'trophy', fmt:p => p.pts, tb:['pts','wr','g'], award:'승점 1위' },
  wr: { t:'승률', unit:'', icon:'pct', fmt:p => pctTxt(p.wr), tb:['wr','pts','gp'], award:'승률 1위' },
  g:  { t:'득점', unit:'골', icon:'ball', fmt:p => p.g, tb:['g','gp','pts'], award:'득점왕' },
  mom:{ t:'MOM', unit:'회', icon:'star', fmt:p => p.mom, tb:['mom','pts','g'], award:'MOM 최다' },
  gp: { t:'출전', unit:'경기', icon:'cal', fmt:p => p.gp, tb:['gp','pts','g'], award:'최다 출전' },
};
const valHTML = (k, p) => `${METRIC[k].fmt(p)}${METRIC[k].unit ? `<small>${METRIC[k].unit}</small>` : ''}`;
function bar3(parts){
  const tot = parts.reduce((s, p) => s + p.v, 0) || 1;
  return `<div class="bar3">${parts.filter(p => p.v).map(p => `<i class="${p.k}" style="flex:${p.v / tot}" ${p.tip ? tipAttr(p.tip) : ''}></i>`).join('')}</div>`;
}
/* 월 표시: 새 달이 시작되는 칸에만, 앞 글자와 3칸 이상 떨어질 때만 표시해 겹치지 않게 */
function monthLabels(G){
  let lastM = null, lastAt = -9;
  return G.map((g, i) => {
    const d = fmtDate(g.date);
    if (d.ok && d.m !== lastM) { lastM = d.m; if (i - lastAt >= 3) { lastAt = i; return `<span>${d.m}월</span>`; } }
    return '<span></span>';
  }).join('');
}

/* ===== 데이터 가공 ===== */
function build(raw){
  const rows = n => (raw[n] || []).slice(1).map(r => r.map(clean));
  const members = new Set(rows('Members').filter(r => r[0]).map(r => r[0]));

  // Game_id가 비어 있는(예전 조회 방식에서 글자가 빠진) 경기 복구용
  const blankIds = [];
  const games = rows('Games')
    .filter(r => (r[0] || r[1]) && r[2] !== '' && r[3] !== '' && r[2] != null && r[3] != null)
    .map((r, i) => {
      const a = int(r[2]), b = int(r[3]);
      const win = (r[4] || (a > b ? 'A' : a < b ? 'B' : 'D')).toUpperCase();
      let id = r[0];
      if (!id) { id = '번외' + (blankIds.length ? ' ' + (blankIds.length + 1) : ''); blankIds.push(id); }
      return { id, date: r[1], a, b, win, idx: i };
    });
  const gById = new Map(games.map(g => [g.id, g]));

  let grp = 0, prevBlank = false;
  const mpRows = rows('Match_Player').map(r => {
    if (!r[0] && r[1]) { if (!prevBlank) grp++; prevBlank = true; r = [blankIds[grp - 1] || '', ...r.slice(1)]; }
    else prevBlank = false;
    return r;
  });
  const mp = mpRows.filter(r => r[0] && r[1] && gById.has(r[0])).map(r => {
    const g = gById.get(r[0]); const team = (r[2] || '').toUpperCase();
    const res = g.win === 'D' ? 'D' : (team && g.win === team ? 'W' : team ? 'L' : (r[6] || '').toUpperCase());
    return { gid: r[0], name: r[1], team, goals: int(r[3]), mom: /mom/i.test(r[4] || ''), late: int(r[5]), og: int(r[7]), res, g };
  });

  let stats = rows('Stats').filter(r => r[0]).map(r => {
    const s = { name: r[0], gp: int(r[1]), g: int(r[2]), og: int(r[3]), mom: int(r[4]), late: int(r[5]), w: int(r[6]), d: int(r[7]), l: int(r[8]), pts: int(r[10]) };
    s.wr = pct(s.w, s.l); return s;
  });
  if (!stats.length) { // Stats 시트가 비었을 때: 경기 기록으로 직접 계산
    const m = new Map();
    mp.forEach(p => {
      const s = m.get(p.name) || { name:p.name, gp:0,g:0,og:0,mom:0,late:0,w:0,d:0,l:0 };
      s.gp++; s.g += p.goals; s.og += p.og; s.mom += p.mom ? 1 : 0; s.late += p.late;
      if (p.res === 'W') s.w++; else if (p.res === 'D') s.d++; else if (p.res === 'L') s.l++;
      m.set(p.name, s);
    });
    stats = [...m.values()].map(s => (s.pts = s.w*3 + s.d, s.wr = pct(s.w, s.l), s));
  }
  const players = stats.filter(s => s.gp > 0);
  const ranked = players.filter(s => s.gp >= CONFIG.RANK_MIN);
  const byName = new Map(stats.map(s => [s.name, s]));

  // 16경기 이상 출전자끼리만 순위 (같은 값은 공동 순위)
  const ranks = {};
  for (const k of Object.keys(METRIC)) {
    const sorted = [...ranked].sort((x, y) => y[k] - x[k]);
    const r = new Map(); let prev = null, rank = 0;
    sorted.forEach((p, i) => { if (p[k] !== prev) { rank = i + 1; prev = p[k]; } r.set(p.name, rank); });
    ranks[k] = r;
  }
  const avg = k => players.length ? players.reduce((s, p) => s + p[k], 0) / players.length : 0;
  const max = k => Math.max(1, ...players.map(p => p[k]));
  const agg = {
    avg: { gp: avg('gp'), g: avg('g'), mom: avg('mom'), pts: avg('pts'), wr: ranked.length ? ranked.reduce((s, p) => s + p.wr, 0) / ranked.length : 0 },
    max: { gp: max('gp'), g: max('g'), mom: max('mom'), pts: max('pts'), wr: 1 },
  };
  const season = (games.find(g => /^\d{8}$/.test(g.date)) || {}).date;
  return { members, games, gById, mp, stats, players, ranked, byName, ranks, agg, season: season ? season.slice(0,4) : '' };
}

async function load(){
  $('#refresh').classList.add('spin');
  let data = null;
  try {
    const names = Object.keys(CONFIG.SHEETS);
    const tables = await Promise.all(names.map(fetchSheet));
    data = {}; names.forEach((n, i) => data[n] = tables[i]);
    if (!data.Stats.length || !data.Games.length) throw new Error('empty');

  } catch (e) { data = SNAPSHOT; state.src = 'fail'; console.warn('시트 읽기 실패:', e); }

}

function renderGames(){

  $('#gsum').innerHTML = `
    <div class="blocks">
      <div class="blk A"><span class="t">${shirt('W','sm')}핑크팀</span><b class="big">${aw}</b><span class="u">승</span><svg class="i f bg" viewBox="0 0 24 24">${P.shirt}</svg></div>
      <div class="blk B"><span class="t">블루팀${shirt('W','sm')}</span><b class="big">${bw}</b><span class="u">승</span><svg class="i f bg" viewBox="0 0 24 24">${P.shirt}</svg></div>

    </div>

      <div class="fact"><span class="k">${ic('cal','xs')}경기</span><b class="v n">${G.length}</b></div>

    <div class="flow-plot" style="${cols}">${G.map(g => {
      const cls = g.win === 'D' ? 'D' : g.win, h = Math.abs(g.a - g.b) / md * 50;

  $('#glistHead').innerHTML = `${ic('list','sm')} 경기 기록 <span class="muted" style="font-weight:500;font-size:13px">최신순</span>`;

function sorted(key, list){
  const tb = METRIC[key].tb;
  return [...list].sort((x, y) => { for (const k of tb) { if (y[k] !== x[k]) return y[k] - x[k]; } return ko(x.name, y.name); });
}

  $('#ruleNote').innerHTML = `${ic('info','xs')}<span>승점 = 승 3점 · 무 1점. 승률 = 승 ÷ (승+패), 무승부는 빠집니다.</span>`;

  $('#leaders').innerHTML = Object.keys(METRIC).map(k => {
    const list = sorted(k, R); if (!list.length) return '';
    const top = list[0], ties = list.filter(p => p[k] === top[k]).length - 1;
    const unit = METRIC[k].unit ? `<small>${METRIC[k].unit}</small>` : '';
    return `<button class="award" type="button" data-p="${esc(top.name)}"><span class="ic">${k === 'mom' ? starIc('') : ic(METRIC[k].icon,'lg')}</span>
      <span class="who"><span class="k">${METRIC[k].award}</span><span class="nm">${esc(top.name)}${ties ? `<small>외 ${ties}명</small>` : ''}</span></span>
      <span class="v n">${METRIC[k].fmt(top)}${unit}</span></button>`;

  const k = state.sort, list = sorted(k, R), rk = DB.ranks[k];

  const q = state.q.toLowerCase();

  const top3 = q ? [] : shown.slice(0, 3);
  $('#top3').innerHTML = top3.map(p => { const r = rk.get(p.name);
    return `<button class="t3 r${Math.min(r, 3)}" type="button" data-p="${esc(p.name)}"><span class="rk">${r}</span><span class="nm">${esc(p.name)}</span><span class="v n">${METRIC[k].fmt(p)}${unit}</span></button>`; }).join('');
  $('#top3').hidden = !top3.length;
  const mx = k === 'wr' ? 1 : Math.max(1, ...list.map(p => p[k]));
  $('#lb').innerHTML = shown.slice(top3.length).map(p => `
    <li data-p="${esc(p.name)}" class="${p.name === mine ? 'me' : ''}">
      <span class="rk">${rk.get(p.name)}</span>
      <div><div class="nm"><span>${esc(p.name)}</span>${p.name === mine ? `<span class="gold" style="display:inline-flex">${ic('bookmark','xs')}</span>` : ''}</div>
        <div class="sub">${p.gp}경기 · ${p.w}승 ${p.d}무 ${p.l}패</div>
        <div class="trk"><i style="width:${p[k] / mx * 100}%"></i></div></div>
      <span class="v n">${METRIC[k].fmt(p)}${unit}</span></li>`).join('') || (top3.length ? '' : `<li class="muted" style="cursor:default;grid-template-columns:1fr">조건에 맞는 선수가 없습니다.</li>`);

  const un = DB.players.filter(p => p.gp < CONFIG.RANK_MIN).sort((a, b) => b.gp - a.gp || ko(a.name, b.name))
    .filter(p => !q || p.name.toLowerCase().includes(q));
  const wasOpen = $('#unranked').open;
  $('#unranked').innerHTML = `<summary><span class="ci">${ic('hourglass')}</span><h3>순위 산정 전 <span class="muted n" style="font-size:15px">${un.length}</span><span class="muted" style="font-size:13px;font-weight:500">명</span></h3>${ic('chev','chev')}</summary>
    <p class="note" style="margin-top:10px;padding:0">${CONFIG.RANK_MIN}경기를 채우면 순위에 들어갑니다.</p>
    <ul class="ur">${un.map(p => `<li data-p="${esc(p.name)}"><span>${esc(p.name)}</span>
      <span class="trk" ${tipAttr(`${p.gp}/${CONFIG.RANK_MIN}경기`)}><i style="width:${p.gp / CONFIG.RANK_MIN * 100}%"></i></span>
      <span class="left n">${p.gp}/${CONFIG.RANK_MIN}</span></li>`).join('')}</ul>`;
  $('#unranked').open = wasOpen || !!(q && un.length && !list.some(p => p.name.toLowerCase().includes(q)));
}

/* ===== 개인 기록 ===== */
function side(logs, t){
  const r = logs.filter(m => m.team === t);
  const w = r.filter(m => m.res === 'W').length, d = r.filter(m => m.res === 'D').length, l = r.filter(m => m.res === 'L').length;
  return { n: r.length, w, d, l, goals: r.reduce((a, m) => a + m.goals, 0) };
}
function renderMe(){
  const box = $('#meBody'); const mine = store.get('wf_me');
  const pin = $('#pin'); const p = state.who && DB.byName.get(state.who);
  const pinned = !!(state.who && mine === state.who);
  pin.classList.toggle('on', pinned);
  pin.innerHTML = `${ic('bookmark','sm')}${pinned ? '저장됨' : '내 이름 저장'}`;
  pin.disabled = !p;

  if (!p || !p.gp) {
    const names = [...DB.players].sort((a, b) => ko(a.name, b.name));
    box.innerHTML = `
      ${state.who ? `<div class="card note" style="padding:16px 20px">${ic('alert','sm')}<span><b>"${esc(state.who)}"</b> ${p ? '선수는 아직 출전 기록이 없어요.' : '기록을 찾지 못했어요. 카페 닉네임과 똑같이 입력했는지 확인해 주세요.'}</span></div>` : ''}
      <div class="card">${cardHead('users', '이름을 눌러 기록 보기', `${names.length}명 · 가나다순`)}
      <div class="chips">${names.map(x => `<button class="chip" type="button" data-p="${esc(x.name)}">${esc(x.name)}<small>${x.gp}</small></button>`).join('')}</div></div>`;
    return;
  }

  const logs = DB.mp.filter(m => m.name === p.name).sort((x, y) => y.g.idx - x.g.idx);
  const isRanked = p.gp >= CONFIG.RANK_MIN;
  const rOf = k => isRanked ? DB.ranks[k].get(p.name) : null;
  const tile = (k, label) => {
    const r = rOf(k);
    return `<div class="tile"><span class="k">${k === 'mom' ? starIc() : ic(METRIC[k].icon,'xs')}${label}</span><b class="v n">${METRIC[k].fmt(p)}</b>
      <span class="r ${r && r <= 3 ? 'top' : ''}">${r ? `${r <= 3 ? ic('medal','xs') : ''}${r}위` : '&nbsp;'}</span></div>`;
  };
  const cmpRow = k => {
    const v = p[k], mx = DB.agg.max[k], av = DB.agg.avg[k];
    const avTxt = k === 'wr' ? pctTxt(av) : av.toFixed(1);
    return `<div class="cmp-row">${k === 'mom' ? ic('star','sm') : ic(METRIC[k].icon,'sm')}<span class="lab">${METRIC[k].t}</span>
      <div class="ctrk" ${tipAttr(`${METRIC[k].t} ${METRIC[k].fmt(p)}${METRIC[k].unit}\n팀 평균 ${avTxt}\n팀 최고 ${k === 'wr' ? '100%' : mx}`)}><i class="fill" style="width:${Math.min(100, v / mx * 100)}%"></i><i class="avg" style="left:calc(${Math.min(100, av / mx * 100)}% - 1.5px)"></i></div>
      <span class="val n">${METRIC[k].fmt(p)}</span></div>`;
  };
  const A = side(logs, 'A'), B = side(logs, 'B');
  const teamCard = (t, s) => `<div class="tcard ${t}"><span class="tt">${shirt(t)}${TEAM[t]} 승률</span>
    <b class="wr n">${s.n ? pctTxt(pct(s.w, s.l)) : '-'}</b>
    ${bar3([{k:'W',v:s.w,tip:`승 ${s.w}`},{k:'D',v:s.d,tip:`무 ${s.d}`},{k:'L',v:s.l,tip:`패 ${s.l}`}])}
    <span class="sm">${s.n}경기 · ${s.w}승 ${s.d}무 ${s.l}패</span></div>`;
  const G = DB.games, byG = new Map(logs.map(m => [m.gid, m]));
  const cols = `grid-template-columns:repeat(${G.length},minmax(0,1fr))`;
  const pr = rOf('pts');

  box.innerHTML = `
    <div class="pcard">
      <div class="band">
        <span class="eyebrow">Player · ${DB.season || ''}</span>
        <h2>${esc(p.name)}${pinned ? `<span class="gold" style="display:inline-flex">${ic('bookmark','sm')}</span>` : ''}</h2>
        <span class="sub">${isRanked ? `${ic('medal','xs')}${CONFIG.RANK_MIN}경기 이상 ${DB.ranked.length}명 중 순위` : `${ic('hourglass','xs')}순위 산정 전 · ${CONFIG.RANK_MIN - p.gp}경기 남음`}</span>
        <div class="ptsrow"><b>${p.pts}</b><span>승점</span>${pr ? `<span class="rkb"><b class="n">${pr}</b><small>위</small></span>` : ''}</div>
      </div>
      <div class="body">
        ${isRanked ? '' : `<div class="prog"><span>${CONFIG.RANK_MIN}경기까지 <b>${CONFIG.RANK_MIN - p.gp}경기</b> 남았어요 · <span class="n" style="font-size:15px">${p.gp}/${CONFIG.RANK_MIN}</span></span><div class="trk"><i style="width:${p.gp / CONFIG.RANK_MIN * 100}%"></i></div></div>`}
        <div class="tiles">${tile('gp','출전')}${tile('g','득점')}${tile('mom','MOM')}${tile('wr','승률')}</div>
        <div class="teams">${teamCard('A', A)}${teamCard('B', B)}</div>
        <div class="wdl">${bar3([{k:'W',v:p.w,tip:`승 ${p.w}`},{k:'D',v:p.d,tip:`무 ${p.d}`},{k:'L',v:p.l,tip:`패 ${p.l}`}])}
          <div class="key"><span><i class="dot W"></i>승 <b>${p.w}</b></span><span><i class="dot D"></i>무 <b>${p.d}</b></span><span><i class="dot L"></i>패 <b>${p.l}</b></span>
          <span style="margin-left:auto">${ic('clock','xs')}지각 <b>${p.late}</b></span><span>${ic('alert','xs')}자책골 <b>${p.og}</b></span></div></div>
      </div>
    </div>

    <div class="card">${cardHead('activity', '팀 평균과 비교', '노란 선 = 팀 평균')}
      <div class="cmp">${['pts','wr','g','mom','gp'].map(cmpRow).join('')}</div></div>

    ${logs.length ? `
    <div class="card">${cardHead('cal', '시즌 출전', `${G.length}경기 중 ${logs.length}경기`)}
      <div class="strip" style="${cols}">${G.map(g => {
        const m = byG.get(g.id), d = fmtDate(g.date);
        if (!m) return `<div class="c off" ${tipAttr(`${gLabel(g.id)} · ${d.short}\n불참`)}></div>`;
        const my = m.team === 'A' ? g.a : g.b, opp = m.team === 'A' ? g.b : g.a;
        return `<div class="c ${m.res}" ${tipAttr(`${gLabel(g.id)} · ${d.short}\n${TEAM[m.team] || ''} ${my}:${opp} ${RES[m.res] || ''}${m.goals ? ` · ${m.goals}골` : ''}${m.mom ? ' · MOM' : ''}`)}></div>`;
      }).join('')}</div>
      <div class="months" style="${cols}">${monthLabels(G)}</div>
      <div class="key" style="margin-top:12px"><span><i class="dot W"></i>승</span><span><i class="dot D"></i>무</span><span><i class="dot L"></i>패</span><span><i class="dot off"></i>불참</span></div>
    </div>


    <div class="card">${cardHead('list', '경기 기록', '최신순')}
      <ul class="log">${logs.map(m => {
        const g = m.g, d = fmtDate(g.date);
        const my = m.team === 'A' ? g.a : g.b, opp = m.team === 'A' ? g.b : g.a;
        return `<li><span class="rc ${m.res}">${RES[m.res] || '?'}</span>
          <div><div class="l1">${shirt(m.team,'xs')}${TEAM[m.team] || '-'}<span class="sc n">${my} : ${opp}</span></div>
          <div class="l2">${esc(d.long)} · ${esc(gLabel(g.id))}</div></div>
          <span class="marks">${m.goals ? `<span>${ic('ball','sm')}<b class="n" style="font-size:16px">${m.goals}</b></span>` : ''}${m.mom ? `<span>${starIc('sm')}</span>` : ''}${m.late ? `<span title="지각">${ic('clock','sm')}</span>` : ''}${m.og ? `<span title="자책골">${ic('alert','sm')}</span>` : ''}</span></li>`;
      }).join('')}</ul>
      ${logs.length !== p.gp ? `<p class="note" style="margin-top:10px;padding:0">${ic('info','xs')}<span>경기 기록 ${logs.length}건과 통계의 경기 수 ${p.gp}가 다릅니다. 시트의 이름 표기를 확인해 주세요.</span></p>` : ''}
    </div>` : `<div class="card note">${ic('info','sm')}경기별 기록이 아직 없습니다.</div>`}`;
}

/* ===== 툴팁 ===== */
const tip = $('#tip');
function placeTip(x, y){
  const r = tip.getBoundingClientRect();
  let left = x + 12, top = y - r.height - 12;
  if (left + r.width > innerWidth - 8) left = x - r.width - 12;
  if (left < 8) left = 8;
  if (top < 8) top = y + 16;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
document.addEventListener('pointerover', e => {
  const el = e.target.closest('[data-tip]'); if (!el) return;
  tip.textContent = el.dataset.tip; tip.hidden = false; placeTip(e.clientX, e.clientY);
});
document.addEventListener('pointermove', e => { if (!tip.hidden) placeTip(e.clientX, e.clientY); });
document.addEventListener('pointerout', e => {
  const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) tip.hidden = true;
});
addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });

/* ===== 이벤트 ===== */
$('#refresh').innerHTML = ic('refresh','sm');
$('#qIco').innerHTML = ic('search','sm');
$('#whoIco').innerHTML = ic('search','sm');
document.querySelectorAll('.tab').forEach(b => { b.insertAdjacentHTML('afterbegin', ic(b.dataset.ico,'sm')); b.addEventListener('click', () => setTab(b.dataset.tab)); });
document.addEventListener('click', e => {
  const f = e.target.closest('.fcol[data-g]');
  if (f) { const d = document.getElementById('g-' + f.dataset.g); if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'center' }); } return; }
  const el = e.target.closest('[data-p]'); if (!el) return;
  e.preventDefault(); tip.hidden = true; openPlayer(el.dataset.p);
});
$('#who').addEventListener('change', e => { const v = clean(e.target.value); if (v) { state.who = v; renderMe(); } });
$('#who').addEventListener('keydown', e => { if (e.key === 'Enter') { const v = clean(e.target.value); if (v) { state.who = v; renderMe(); e.target.blur(); } } });
$('#pin').addEventListener('click', () => {
  if (!state.who) return;
  store.set('wf_me', store.get('wf_me') === state.who ? null : state.who);
  renderMe(); renderRank();
});
$('#sortSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.sort = b.dataset.k; renderRank(); });
$('#q').addEventListener('input', e => { state.q = clean(e.target.value); renderRank(); });
$('#refresh').addEventListener('click', () => load());

/* ===== 시작 ===== */
(function start(){
  const mine = store.get('wf_me');
  const h = (location.hash || '').slice(1);
  if (mine) { state.who = mine; $('#who').value = mine; }
  setTab(['games','rank','me'].includes(h) ? h : 'games', false);
  load();
})();
</script>

</body>
</html>
