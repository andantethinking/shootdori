<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>승률계산기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 손으로 보는 모바일 앱 셸 — 상단 고정 탭, 720px 단일 컬럼, 조끼색(핑크/블루)이 곧 팀 색 */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --sunk:#E8ECF2; --ink:#121826; --muted:#5A6375; --line:#DCE1E9;
  --pink:#D93D74; --pink-soft:#FBE3EC; --blue:#2C66D8; --blue-soft:#E0EAFB;
  --win:#16865A; --win-soft:#DDF2E8; --draw:#7B8496; --draw-soft:#E9ECF1; --loss:#C9443B; --loss-soft:#F8E1DF;
  --gold:#B7861B;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1118; --surface:#161C27; --sunk:#1E2532; --ink:#E8ECF3; --muted:#97A0B2; --line:#2A3242;
  --pink:#FF6B9E; --pink-soft:#3A1A28; --blue:#6A9BFF; --blue-soft:#18264A;
  --win:#3CC489; --win-soft:#123326; --draw:#9AA3B5; --draw-soft:#252C39; --loss:#FF7A70; --loss-soft:#3A1C1A;
  --gold:#E2B54A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1118; --surface:#161C27; --sunk:#1E2532; --ink:#E8ECF3; --muted:#97A0B2; --line:#2A3242;
  --pink:#FF6B9E; --pink-soft:#3A1A28; --blue:#6A9BFF; --blue-soft:#18264A;
  --win:#3CC489; --win-soft:#123326; --draw:#9AA3B5; --draw-soft:#252C39; --loss:#FF7A70; --loss-soft:#3A1C1A;
  --gold:#E2B54A; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* 헤더 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.01em;line-height:1.1;display:flex;align-items:center;gap:10px}
.bib{display:inline-flex;width:22px;height:22px;border-radius:6px;overflow:hidden;transform:rotate(-8deg)}
.bib i{flex:1}.bib i:first-child{background:var(--pink)}.bib i:last-child{background:var(--blue)}
.brand small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em;margin-top:3px}
.status{display:flex;align-items:center;gap:6px;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--draw)}
.pill.live .dot{background:var(--win)} .pill.warn{background:var(--loss-soft);color:var(--loss)} .pill.warn .dot{background:var(--loss)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.iconbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:4px}
.tab{flex:1;border:0;background:none;padding:10px 4px 12px;font-weight:600;color:var(--muted);cursor:pointer;position:relative;font-size:15px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--ink)}

main.wrap{padding-block:18px 48px;display:grid;gap:16px}
.view{display:grid;gap:16px;min-width:0}
.view>*{min-width:0}
h3{margin:0;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* 선수 찾기 */
.pick{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.pickrow{display:flex;gap:8px}
.field{flex:1;min-width:0;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--ink)}

/* 선수 카드 */
.hero{position:relative;overflow:hidden;padding:20px 18px 18px}
.hero::before{content:"";position:absolute;inset:0 0 auto auto;width:150px;height:150px;transform:translate(48px,-56px) rotate(24deg);background:linear-gradient(90deg,var(--pink) 0 50%,var(--blue) 50% 100%);opacity:.14;border-radius:24px}
.hero-name{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;position:relative}
.hero-name h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,40px);line-height:1.05;letter-spacing:.01em;word-break:keep-all}
.mine{font-size:12px;font-weight:700;color:var(--gold)}
.hero-sub{margin:6px 0 0;color:var(--muted);font-size:13.5px;position:relative}
.hero-sub b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:16px;position:relative}
.tile{background:var(--sunk);border-radius:12px;padding:10px 8px;text-align:center}
.tile b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15}
.tile span{font-size:12px;color:var(--muted);font-weight:600}
.tile.key{background:var(--ink);color:var(--surface)} .tile.key span{color:inherit;opacity:.75}
@media (max-width:480px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.tile.key{grid-column:span 4;display:flex;align-items:baseline;justify-content:center;gap:10px}.tile b{font-size:21px}}
.wdl{margin-top:16px;display:grid;gap:6px}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.bar i{display:block;height:100%}
.bar .w{background:var(--win)}.bar .d{background:var(--draw)}.bar .l{background:var(--loss)}
.bar .a{background:var(--pink)}.bar .b{background:var(--blue)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend b{color:var(--ink);font-weight:700}
.minor{display:flex;flex-wrap:wrap;gap:6px 16px;margin:14px 0 0;font-size:13px;color:var(--muted)}
.minor b{color:var(--ink)}

.res{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:8px;font-weight:700;font-size:13px}
.res.W{background:var(--win-soft);color:var(--win)} .res.D{background:var(--draw-soft);color:var(--draw)} .res.L{background:var(--loss-soft);color:var(--loss)}
.form{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.side{border-radius:12px;padding:12px}
.side.A{background:var(--pink-soft)} .side.B{background:var(--blue-soft)}
.side .lab{font-weight:700;font-size:13px}
.side.A .lab{color:var(--pink)} .side.B .lab{color:var(--blue)}
.side .rec{font-family:var(--display);font-size:20px;margin-top:2px}
.side .sm{font-size:12px;color:var(--muted)}

.log{list-style:none;margin:10px 0 0;padding:0;display:grid}
.log li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log .when{font-size:12px;color:var(--muted);line-height:1.3}
.log .when b{display:block;color:var(--ink);font-size:13px}
.log .mid{min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vest{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.vest.A{background:var(--pink-soft);color:var(--pink)} .vest.B{background:var(--blue-soft);color:var(--blue)}
.sc{font-weight:700}
.badge{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--ink)}
.badge.mom{background:var(--gold);color:var(--surface)}
.badge.warn{background:var(--loss-soft);color:var(--loss)}

/* 순위 */
.leaders{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(138px,1fr);gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;cursor:pointer}
.lead .k{font-size:12px;color:var(--muted);font-weight:600}
.lead .n{font-family:var(--display);font-size:20px;margin-top:4px;line-height:1.15;word-break:keep-all}
.lead .v{font-size:13px;font-weight:700}
.lead .more{font-size:11.5px;color:var(--muted)}
.controls{display:grid;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row2 .field{padding:9px 12px;font-size:15px}
.row2 select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 10px}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{padding:10px 8px;text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th:nth-child(1),td:nth-child(1){text-align:center;width:44px}
th:nth-child(2),td:nth-child(2){text-align:left}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--sunk)}
td.hl,th.hl{color:var(--ink);font-weight:700}
.rk{font-family:var(--display);font-size:16px}
.rk.t1{color:var(--gold)}
tr.me td{background:var(--sunk)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* 경기 */
.sum{display:grid;gap:10px}
.sumrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.big3{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.big3 span{font-size:13px;color:var(--muted);font-weight:600}
.big3 b{font-family:var(--display);font-weight:400;font-size:26px;margin-left:4px}
.big3 .A b{color:var(--pink)} .big3 .B b{color:var(--blue)}
.games{display:grid;gap:10px}
details.game{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.game summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;gap:8px}
details.game summary::-webkit-details-marker{display:none}
.gmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:8px}
.gmeta b{color:var(--ink)}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.board .t{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.board .t.A{color:var(--pink)} .board .t.B{color:var(--blue);justify-content:flex-end}
.board .t .crown{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:currentColor}
.board .t .crown span{color:var(--surface)}
.digits{font-family:var(--display);font-size:30px;line-height:1;display:flex;gap:10px;align-items:center}
.digits .lose{color:var(--muted)}
.digits i{font-style:normal;color:var(--muted);font-size:22px}
.gfoot{font-size:12.5px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.gfoot b{color:var(--ink);font-weight:600}
.lineups{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.lineups ul{list-style:none;margin:0;padding:10px 12px;border-radius:12px;display:grid;gap:4px;font-size:14px}
.lineups .A{background:var(--pink-soft)} .lineups .B{background:var(--blue-soft)}
.lineups li{display:flex;justify-content:space-between;gap:6px}
.lineups li button{border:0;background:none;padding:0;cursor:pointer;text-align:left}
.lineups li button:hover{text-decoration:underline}
.lineups .guest{color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px}
.lineups .hd{font-size:12px;font-weight:700;margin-bottom:2px}
.lineups .A .hd{color:var(--pink)} .lineups .B .hd{color:var(--blue)}
.gl{font-size:12px;font-weight:700}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1><span class="bib" aria-hidden="true"><i></i><i></i></span><span>승률계산기<small id="season">시즌 개인 기록</small></span></h1>
      <div class="status">
        <span class="pill" id="pill"><span class="dot"></span><span id="pillText">불러오는 중</span></span>
        <button class="iconbtn" id="refresh" type="button" aria-label="새로고침"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-me" data-tab="me" aria-selected="false">개인 기록</button>
      <button class="tab" role="tab" id="tab-rank" data-tab="rank" aria-selected="true">전체 순위</button>
      <button class="tab" role="tab" id="tab-games" data-tab="games" aria-selected="false">경기 결과</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-me" hidden>
    <div class="pick">
      <label for="who"><h3>선수 찾기</h3></label>
      <div class="pickrow">
        <input class="field" id="who" list="names" placeholder="카페 닉네임 입력" autocomplete="off" enterkeyhint="search">
        <button class="btn" id="pin" type="button">내 이름으로 저장</button>
      </div>
      <datalist id="names"></datalist>
    </div>
    <div id="meBody" class="view"></div>
  </section>

  <section class="view" id="view-rank">
    <div class="leaders" id="leaders"></div>
    <div class="controls">
      <div class="seg" id="sortSeg" role="group" aria-label="정렬 기준">
        <button type="button" data-k="pts" aria-pressed="true">승점</button>
        <button type="button" data-k="g" aria-pressed="false">득점</button>
        <button type="button" data-k="wr" aria-pressed="false">승률</button>
        <button type="button" data-k="mom" aria-pressed="false">MOM</button>
        <button type="button" data-k="gp" aria-pressed="false">출전</button>
      </div>
      <div class="row2">
        <input class="field" id="q" placeholder="이름으로 찾기" autocomplete="off" style="flex:1;min-width:140px">
        <label class="note" for="minGp">최소 출전</label>
        <select id="minGp"><option value="1">1경기</option><option value="5">5경기</option><option value="10">10경기</option></select>
      </div>
    </div>
    <div class="tablebox"><table id="rankTable"><thead></thead><tbody></tbody></table></div>
    <p class="note">승점 = 승 3점 · 무 1점 · 패 0점. 승률 = 승 ÷ (승+패), 무승부는 계산에서 빠집니다. 줄을 누르면 그 선수의 기록이 열립니다.</p>
  </section>

  <section class="view" id="view-games" hidden>
    <div class="card sum" id="gsum"></div>
    <div class="games" id="glist"></div>
  </section>

/* 시트 한 장을 CSV로 읽는다 (구글 시트 공개 조회 주소) */
async function fetchSheet(name){
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(name + ' ' + res.status);
  const text = await res.text();
  if (/^\s*<!doctype|<html/i.test(text)) throw new Error(name + ' 공개 설정 확인 필요');
  return parseCSV(text);
}
function parseCSV(text){
  const out = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); out.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); out.push(row); }
  return out;
}

  const rows = n => (raw[n] || []).slice(1).map(r => r.map(clean));
  const members = new Set(rows('Members').filter(r => r[0]).map(r => r[0]));

  // 구글 공개 조회는 숫자 열에 섞인 글자(예: Game_id "설날")를 빈칸으로 돌려준다.
  // 점수가 있는데 Game_id만 빈 경기는 "번외"로 이름 붙이고, Match_Player의 빈 Game_id 묶음을 순서대로 짝지어 복구한다.
  const blankIds = [];
  const games = rows('Games')
    .filter(r => (r[0] || r[1]) && r[2] !== '' && r[3] !== '' && r[2] != null && r[3] != null)
    .map((r, i) => {
      const a = int(r[2]), b = int(r[3]);
      const win = (r[4] || (a > b ? 'A' : a < b ? 'B' : 'D')).toUpperCase();
      let id = r[0];
      if (!id) { id = '번외' + (blankIds.length ? ' ' + (blankIds.length + 1) : ''); blankIds.push(id); }
      return { id, date: r[1], a, b, win, idx: i };
    });
  const gById = new Map(games.map(g => [g.id, g]));

  let grp = 0, prevBlank = false;
  const mpRows = rows('Match_Player').map(r => {
    if (!r[0] && r[1]) { if (!prevBlank) grp++; prevBlank = true; r = [blankIds[grp - 1] || '', ...r.slice(1)]; }
    else prevBlank = false;
    return r;
  });
  const mp = mpRows.filter(r => r[0] && r[1] && gById.has(r[0])).map(r => {
    const g = gById.get(r[0]); const team = (r[2] || '').toUpperCase();
    const res = g.win === 'D' ? 'D' : (team && g.win === team ? 'W' : team ? 'L' : (r[6] || '').toUpperCase());
    return { gid: r[0], name: r[1], team, goals: int(r[3]), mom: /mom/i.test(r[4] || ''), late: int(r[5]), og: int(r[7]), res, g };
  });

  let stats = rows('Stats').filter(r => r[0]).map(r => {
    const s = { name: r[0], gp: int(r[1]), g: int(r[2]), og: int(r[3]), mom: int(r[4]), late: int(r[5]), w: int(r[6]), d: int(r[7]), l: int(r[8]), pts: int(r[10]) };
    s.wr = pct(s.w, s.l);
    return s;
  });
  if (!stats.length) { // Stats 시트가 비었을 때: 경기 기록으로 직접 계산
    const m = new Map();
    mp.forEach(p => {
      const s = m.get(p.name) || { name:p.name, gp:0,g:0,og:0,mom:0,late:0,w:0,d:0,l:0 };
      s.gp++; s.g += p.goals; s.og += p.og; s.mom += p.mom ? 1 : 0; s.late += p.late;
      if (p.res === 'W') s.w++; else if (p.res === 'D') s.d++; else if (p.res === 'L') s.l++;
      m.set(p.name, s);
    });
    stats = [...m.values()].map(s => (s.pts = s.w*3 + s.d, s.wr = pct(s.w, s.l), s));
  }
  const players = stats.filter(s => s.gp > 0);
  const byName = new Map(stats.map(s => [s.name, s]));

  // 승점 순위(동점 공동 순위)
  const rankOf = key => {
    const sorted = [...players].sort((x, y) => y[key] - x[key]);
    const r = new Map(); let prev = null, rank = 0;
    sorted.forEach((p, i) => { if (p[key] !== prev) { rank = i + 1; prev = p[key]; } r.set(p.name, rank); });
    return r;
  };
  const season = (games.find(g => /^\d{8}$/.test(g.date)) || {}).date;
  return { members, games, gById, mp, stats, players, byName, ptsRank: rankOf('pts'), goalRank: rankOf('g'), season: season ? season.slice(0,4) : '' };
}

/* ===== 상태 ===== */
const state = { tab: 'rank', who: null, sort: 'pts', q: '', minGp: 1, src: '', loadedAt: null };
let DB = null;
const SNAPSHOT = JSON.parse(document.getElementById('snapshot').textContent);

async function load(fresh){
  $('#refresh').classList.add('spin');
  let data = null;
  try {
    const tables = await Promise.all(CONFIG.SHEETS.map(fetchSheet));
    data = {}; CONFIG.SHEETS.forEach((n, i) => data[n] = tables[i]);
    if (!data.Stats.length || !data.Games.length) throw new Error('empty');
    state.src = 'live';
  } catch (e) { data = SNAPSHOT; state.src = 'fail'; console.warn('시트 읽기 실패:', e); }
  DB = build(data);
  state.loadedAt = new Date();
  $('#refresh').classList.remove('spin');
  renderStatus(); renderAll();
}

function renderStatus(){
  const pill = $('#pill'), t = $('#pillText');
  pill.className = 'pill' + (state.src === 'live' ? ' live' : state.src === 'fail' ? ' warn' : '');
  if (state.src === 'live') {
    const d = state.loadedAt; t.textContent = `시트 연결 · ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
  } else t.textContent = `${CONFIG.SNAPSHOT_LABEL} 저장본`;
  $('#season').textContent = `${DB.season ? DB.season + ' 시즌 · ' : ''}${DB.games.length}경기`;
  $('#foot').textContent = state.src === 'live'
    ? '기록 시트를 그대로 읽어 와 보여 줍니다. 오른쪽 위 새로고침을 누르면 최신 기록을 다시 불러옵니다.'
    : `시트를 읽지 못해 ${CONFIG.SNAPSHOT_LABEL} 저장본을 보여 주고 있습니다. 잠시 뒤 새로고침을 눌러 주세요.`;
}

/* ===== 탭 ===== */
function setTab(t, push){
  state.tab = t;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  ['me','rank','games'].forEach(k => $('#view-' + k).hidden = k !== t);
  if (push !== false) { try { history.replaceState(null, '', '#' + t); } catch(e){} }
  window.scrollTo({ top: 0 });
}
function openPlayer(name){
  state.who = name; $('#who').value = name; renderMe(); setTab('me');
}

function renderAll(){ renderNames(); renderMe(); renderRank(); renderGames(); }

function renderNames(){
  const names = DB.players.map(p => p.name).sort(ko);
  $('#names').innerHTML = names.map(n => `<option value="${esc(n)}"></option>`).join('');
}

/* ===== 개인 기록 ===== */
function renderMe(){
  const box = $('#meBody'); const mine = store.get('wf_me');
  const pin = $('#pin');
  const p = state.who && DB.byName.get(state.who);
  pin.classList.toggle('on', !!(state.who && mine === state.who));
  pin.textContent = state.who && mine === state.who ? '★ 내 이름' : '내 이름으로 저장';
  pin.disabled = !p;

  if (!p) {
    const names = DB.players.map(x => x.name).sort(ko);
    box.innerHTML = `
      ${state.who ? `<div class="card"><b>"${esc(state.who)}"</b> 기록을 찾지 못했어요. 카페 닉네임과 똑같이 입력했는지 확인해 주세요.</div>` : ''}
      <div class="card"><h3>이름을 눌러 기록 보기</h3><p class="note" style="margin-top:4px">출전 기록이 있는 ${names.length}명 · 가나다순</p>
      <div class="chips" style="margin-top:12px">${names.map(n => `<button class="chip" type="button" data-p="${esc(n)}">${esc(n)}</button>`).join('')}</div></div>`;
    return;
  }

  const logs = DB.mp.filter(m => m.name === p.name).sort((x, y) => y.g.idx - x.g.idx);
  const N = DB.players.length;
  const side = t => {
    const r = logs.filter(m => m.team === t);
    const w = r.filter(m => m.res === 'W').length, d = r.filter(m => m.res === 'D').length, l = r.filter(m => m.res === 'L').length;
    return { n: r.length, w, d, l, goals: r.reduce((a, m) => a + m.goals, 0) };
  };
  const A = side('A'), B = side('B');
  const tot = Math.max(1, p.w + p.d + p.l);
  const isMine = mine === p.name;

  box.innerHTML = `
    <article class="card hero">
      <div class="hero-name"><h2>${esc(p.name)}</h2>${isMine ? '<span class="mine">★ 내 기록</span>' : ''}</div>
      <p class="hero-sub">승점 <b>${DB.ptsRank.get(p.name) || '-'}위</b> · 득점 <b>${p.g ? DB.goalRank.get(p.name) + '위' : '-'}</b> · 출전 선수 ${N}명 중</p>
      <div class="tiles num">
        <div class="tile key"><b>${p.pts}</b><span>승점</span></div>
        <div class="tile"><b>${p.gp}</b><span>경기</span></div>
        <div class="tile"><b>${p.g}</b><span>득점</span></div>
        <div class="tile"><b>${p.mom}</b><span>MOM</span></div>
        <div class="tile"><b>${pctTxt(p.wr)}</b><span>승률</span></div>
      </div>
      <div class="wdl">
        <div class="bar" role="img" aria-label="${p.w}승 ${p.d}무 ${p.l}패">
          ${p.w ? `<i class="w" style="width:${p.w/tot*100}%"></i>` : ''}${p.d ? `<i class="d" style="width:${p.d/tot*100}%"></i>` : ''}${p.l ? `<i class="l" style="width:${p.l/tot*100}%"></i>` : ''}
        </div>
        <div class="legend num"><span><b style="color:var(--win)">${p.w}</b> 승</span><span><b>${p.d}</b> 무</span><span><b style="color:var(--loss)">${p.l}</b> 패</span></div>
      </div>
      <div class="minor num">
        <span>경기당 득점 <b>${p.gp ? (p.g / p.gp).toFixed(2) : '0'}</b></span>
        <span>지각 <b>${p.late}</b></span>
        <span>자책골 <b>${p.og}</b></span>
      </div>
    </article>

    ${logs.length ? `
    <div class="card">
      <h3>최근 ${Math.min(5, logs.length)}경기 · 최신순</h3>
      <div class="form">${logs.slice(0,5).map(m => `<span class="res ${m.res}" title="${esc(gLabel(m.gid))}">${RES[m.res] || '?'}</span>`).join('')}</div>
      <div class="split">
        <div class="side A"><div class="lab">핑크 조끼</div><div class="rec num">${A.w}승 ${A.d}무 ${A.l}패</div><div class="sm num">${A.n}경기 · ${A.goals}골 · 승률 ${pctTxt(pct(A.w, A.l))}</div></div>
        <div class="side B"><div class="lab">블루 조끼</div><div class="rec num">${B.w}승 ${B.d}무 ${B.l}패</div><div class="sm num">${B.n}경기 · ${B.goals}골 · 승률 ${pctTxt(pct(B.w, B.l))}</div></div>
      </div>
    </div>
    <div class="card">
      <h3>경기별 기록 · ${logs.length}경기</h3>
      <ul class="log">${logs.map(m => {
        const g = m.g, d = fmtDate(g.date);
        const mine = m.team === 'A' ? g.a : g.b, opp = m.team === 'A' ? g.b : g.a;
        return `<li>
          <div class="when"><b>${esc(d.short)}</b>${esc(gLabel(g.id))}</div>
          <div class="mid"><span class="vest ${m.team}">${TEAM[m.team] || '-'}</span><span class="sc num">${mine} : ${opp}</span>
            ${m.goals ? `<span class="badge num">${m.goals}골</span>` : ''}${m.mom ? '<span class="badge mom">MOM</span>' : ''}${m.og ? `<span class="badge warn">자책 ${m.og}</span>` : ''}${m.late ? '<span class="badge warn">지각</span>' : ''}</div>
          <span class="res ${m.res}">${RES[m.res] || '?'}</span></li>`;
      }).join('')}</ul>
      ${logs.length !== p.gp ? `<p class="note" style="margin-top:10px">경기 기록 ${logs.length}건과 통계의 경기 수 ${p.gp}가 다릅니다. 시트의 이름 표기를 확인해 주세요.</p>` : ''}
    </div>` : `<div class="card note">경기별 기록이 아직 없습니다.</div>`}`;
}

/* ===== 전체 순위 ===== */
const COLS = [
  { k:'rank', h:'#' }, { k:'name', h:'이름' }, { k:'gp', h:'경기' }, { k:'wdl', h:'승-무-패' },
  { k:'g', h:'득점' }, { k:'mom', h:'MOM' }, { k:'wr', h:'승률' }, { k:'pts', h:'승점' }
];
function sorted(key, minGp){
  const tb = { pts:['pts','wr','g'], g:['g','gp','pts'], wr:['wr','pts','gp'], mom:['mom','pts','g'], gp:['gp','pts','g'] }[key];
  return DB.players.filter(p => p.gp >= minGp).sort((x, y) => {
    for (const k of tb) { if (y[k] !== x[k]) return y[k] - x[k]; }
    return ko(x.name, y.name);
  });
}
function renderLeaders(){
  const cards = [
    { k:'pts', t:'승점 1위', v:p => `${p.pts}점` },
    { k:'g', t:'득점왕', v:p => `${p.g}골` },
    { k:'mom', t:'MOM 최다', v:p => `${p.mom}회` },
    { k:'gp', t:'최다 출전', v:p => `${p.gp}경기` },
    { k:'wr', t:'승률 1위 · 10경기+', v:p => pctTxt(p.wr), min:10 },
  ];
  $('#leaders').innerHTML = cards.map(c => {
    const list = sorted(c.k, c.min || 1); if (!list.length) return '';
    const top = list[0]; const ties = list.filter(p => p[c.k] === top[c.k]).length - 1;
    return `<button class="lead" type="button" data-p="${esc(top.name)}"><div class="k">${c.t}</div><div class="n">${esc(top.name)}</div><div class="v num">${c.v(top)}${ties ? ` <span class="more">외 ${ties}명</span>` : ''}</div></button>`;
  }).join('');
}
function renderRank(){
  renderLeaders();
  document.querySelectorAll('#sortSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === state.sort));
  $('#minGp').value = String(state.minGp);
  const list = sorted(state.sort, state.minGp);
  const hlKey = state.sort;
  // 정렬 기준값으로 공동 순위
  let prev = null, rank = 0; const ranks = list.map((p, i) => { if (p[hlKey] !== prev) { rank = i + 1; prev = p[hlKey]; } return rank; });
  const q = state.q.toLowerCase(); const mine = store.get('wf_me');
  $('#rankTable thead').innerHTML = `<tr>${COLS.map(c => `<th class="${c.k === hlKey ? 'hl' : ''}">${c.h}</th>`).join('')}</tr>`;
  const body = list.map((p, i) => ({ p, r: ranks[i] })).filter(x => !q || x.p.name.toLowerCase().includes(q)).map(({ p, r }) => `
    <tr data-p="${esc(p.name)}" class="${p.name === mine ? 'me' : ''}">
      <td><span class="rk ${r === 1 ? 't1' : ''}">${r}</span></td>
      <td>${esc(p.name)}${p.name === mine ? ' <span class="mine">★</span>' : ''}</td>
      <td class="num ${hlKey==='gp'?'hl':''}">${p.gp}</td>
      <td class="num">${p.w}-${p.d}-${p.l}</td>
      <td class="num ${hlKey==='g'?'hl':''}">${p.g}</td>
      <td class="num ${hlKey==='mom'?'hl':''}">${p.mom}</td>
      <td class="num ${hlKey==='wr'?'hl':''}">${pctTxt(p.wr)}</td>
      <td class="num ${hlKey==='pts'?'hl':''}">${p.pts}</td>
    </tr>`).join('');
  $('#rankTable tbody').innerHTML = body || `<tr><td colspan="8" class="empty">조건에 맞는 선수가 없습니다.</td></tr>`;
}

/* ===== 경기 결과 ===== */
function renderGames(){
  const G = DB.games;
  const aw = G.filter(g => g.win === 'A').length, bw = G.filter(g => g.win === 'B').length, dr = G.length - aw - bw;
  const goals = G.reduce((s, g) => s + g.a + g.b, 0);
  const t = Math.max(1, G.length);
  $('#gsum').innerHTML = `
    <div class="sumrow"><h3>조끼 대결 전적 · ${G.length}경기</h3><span class="note num">경기당 평균 ${(goals / t).toFixed(1)}골</span></div>
    <div class="big3 num"><span class="A">핑크 승<b>${aw}</b></span><span>무<b>${dr}</b></span><span class="B">블루 승<b>${bw}</b></span></div>
    <div class="bar" role="img" aria-label="핑크 ${aw}승, 무 ${dr}, 블루 ${bw}승">${aw ? `<i class="a" style="width:${aw/t*100}%"></i>` : ''}${dr ? `<i class="d" style="width:${dr/t*100}%"></i>` : ''}${bw ? `<i class="b" style="width:${bw/t*100}%"></i>` : ''}</div>`;

  const byGame = new Map();
  DB.mp.forEach(m => { if (!byGame.has(m.gid)) byGame.set(m.gid, []); byGame.get(m.gid).push(m); });
  $('#glist').innerHTML = [...G].reverse().map(g => {
    const d = fmtDate(g.date, true); const ps = byGame.get(g.id) || [];
    const moms = ps.filter(m => m.mom).map(m => m.name);
    const scorers = ps.filter(m => m.goals).sort((x, y) => y.goals - x.goals).map(m => `${m.name}${m.goals > 1 ? ' ' + m.goals : ''}`);
    const lose = s => (g.win !== 'D' && g.win !== s) ? 'lose' : '';
    const team = s => {
      const list = ps.filter(m => m.team === s);
      return `<ul class="${s}"><li class="hd">${TEAM[s]} · ${list.length}명</li>${list.map(m => `<li><button type="button" data-p="${esc(m.name)}" class="${DB.members.size && !DB.members.has(m.name) ? 'guest' : ''}" ${DB.members.size && !DB.members.has(m.name) ? 'title="회원 명단에 없는 이름"' : ''}>${esc(m.name)}</button><span class="gl">${m.goals ? m.goals + '골' : ''}${m.mom ? ' MOM' : ''}</span></li>`).join('')}</ul>`;
    };
    return `<details class="game"><summary>
      <div class="gmeta"><span><b>${esc(gLabel(g.id))}</b> · ${esc(d.long)}</span><span>${g.win === 'D' ? '무승부' : TEAM[g.win] + ' 승'}</span></div>
      <div class="board">
        <span class="t A">핑크</span>
        <span class="digits num"><span class="${lose('A')}">${g.a}</span><i>:</i><span class="${lose('B')}">${g.b}</span></span>
        <span class="t B">블루</span>
      </div>
      <div class="gfoot">${moms.length ? `<span>MOM <b>${moms.map(esc).join(', ')}</b></span>` : ''}${scorers.length ? `<span>득점 ${scorers.map(esc).join(', ')}</span>` : ''}${!ps.length ? '<span>선수 기록 없음</span>' : ''}</div>
    </summary>${ps.length ? `<div class="lineups">${team('A')}${team('B')}</div>` : ''}</details>`;
  }).join('');
}

/* ===== 이벤트 ===== */
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
document.addEventListener('click', e => {
  const el = e.target.closest('[data-p]'); if (!el) return;
  e.preventDefault(); openPlayer(el.dataset.p);
});
$('#who').addEventListener('change', e => { const v = clean(e.target.value); if (v) { state.who = v; renderMe(); } });
$('#who').addEventListener('keydown', e => { if (e.key === 'Enter') { const v = clean(e.target.value); if (v) { state.who = v; renderMe(); e.target.blur(); } } });
$('#pin').addEventListener('click', () => {
  if (!state.who) return;
  store.set('wf_me', store.get('wf_me') === state.who ? null : state.who);
  renderMe(); renderRank();
});
$('#sortSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.sort = b.dataset.k;
  if (state.sort === 'wr' && state.minGp < 10) state.minGp = 10;
  renderRank();
});
$('#q').addEventListener('input', e => { state.q = clean(e.target.value); renderRank(); });
$('#minGp').addEventListener('change', e => { state.minGp = +e.target.value; renderRank(); });
$('#refresh').addEventListener('click', () => load(true));

/* ===== 시작 ===== */
(function start(){
  const mine = store.get('wf_me');
  const h = (location.hash || '').slice(1);
  if (mine) { state.who = mine; $('#who').value = mine; }
  setTab(['me','rank','games'].includes(h) ? h : (mine ? 'me' : 'rank'), false);
  load(false);
})();
</script>
